name: render-kappa

on:
  workflow_dispatch:
  push:
    paths:
      - "src/videos/kappa/**"
      - "src/videos/bridge/toon.ts"
      - "src/index.tsx"
      - "scripts/render.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/render-kappa.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { seg: 0, from: 0, to: 200 }
          - { seg: 1, from: 201, to: 401 }
          - { seg: 2, from: 402, to: 602 }
          - { seg: 3, from: 603, to: 803 }
          - { seg: 4, from: 804, to: 1004 }
          - { seg: 5, from: 1005, to: 1205 }
          - { seg: 6, from: 1206, to: 1406 }
          - { seg: 7, from: 1407, to: 1607 }
          - { seg: 8, from: 1608, to: 1808 }
          - { seg: 9, from: 1809, to: 2009 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx remotion browser ensure
      - name: Install ffmpeg
        # render.mjs trims the first 2 (warm-up) frames with ffmpeg; the
        # ubuntu-latest runner does NOT ship ffmpeg (proven 2026-11-27).
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Render segment
        env:
          GL_MODE: swangle
          COMP_ID: KappaShort720
        run: node scripts/render.mjs ${{ matrix.from }} ${{ matrix.to }} 1 out/segk-${{ matrix.seg }}.mp4 2
      - name: Push segment to its own branch
        run: |
          cp out/segk-${{ matrix.seg }}.mp4 /tmp/segk-${{ matrix.seg }}.mp4
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git switch --orphan segk-${{ matrix.seg }}
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/segk-${{ matrix.seg }}.mp4 ./segk-${{ matrix.seg }}.mp4
          git add segk-${{ matrix.seg }}.mp4
          git commit -m "kappa segment ${{ matrix.seg }} frames ${{ matrix.from }}-${{ matrix.to }}"
          git push -f origin segk-${{ matrix.seg }}
