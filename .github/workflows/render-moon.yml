name: render-moon

on:
  workflow_dispatch:
  push:
    paths:
      - "src/videos/moon/**"
      - "src/videos/bridge/**"
      - "src/index.tsx"
      - "scripts/render.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/render-moon.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { seg: 0, from: 0, to: 285 }
          - { seg: 1, from: 286, to: 571 }
          - { seg: 2, from: 572, to: 857 }
          - { seg: 3, from: 858, to: 1143 }
          - { seg: 4, from: 1144, to: 1429 }
          - { seg: 5, from: 1430, to: 1715 }
          - { seg: 6, from: 1716, to: 2001 }
          - { seg: 7, from: 2002, to: 2287 }
          - { seg: 8, from: 2288, to: 2573 }
          - { seg: 9, from: 2574, to: 2856 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx remotion browser ensure
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Render segment
        env:
          GL_MODE: swangle
          COMP_ID: MoonShort720
        run: node scripts/render.mjs ${{ matrix.from }} ${{ matrix.to }} 1 out/segmn-${{ matrix.seg }}.mp4 2
      - name: Push segment to its own branch
        run: |
          cp out/segmn-${{ matrix.seg }}.mp4 /tmp/segmn-${{ matrix.seg }}.mp4
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git switch --orphan segmn-${{ matrix.seg }}
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/segmn-${{ matrix.seg }}.mp4 ./segmn-${{ matrix.seg }}.mp4
          git add segmn-${{ matrix.seg }}.mp4
          git commit -m "segmn-${{ matrix.seg }}"
          git push -f origin segmn-${{ matrix.seg }}
