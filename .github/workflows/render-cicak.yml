name: render-cicak

on:
  workflow_dispatch:
  push:
    paths:
      - "src/konon/**"
      - "src/index.tsx"
      - "scripts/render.mjs"
      - "package.json"
      - "package-lock.json"
      - "public/fonts/**"
      - ".github/workflows/render-cicak.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { seg: 0, from: 0, to: 241 }
          - { seg: 1, from: 242, to: 482 }
          - { seg: 2, from: 483, to: 723 }
          - { seg: 3, from: 724, to: 964 }
          - { seg: 4, from: 965, to: 1205 }
          - { seg: 5, from: 1206, to: 1446 }
          - { seg: 6, from: 1447, to: 1687 }
          - { seg: 7, from: 1688, to: 1928 }
          - { seg: 8, from: 1929, to: 2169 }
          - { seg: 9, from: 2170, to: 2411 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx remotion browser ensure
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Render segment
        env:
          GL_MODE: swangle
          COMP_ID: CicakKonon720
          SILENT: "1"
          WARMUP: "0"
        run: node scripts/render.mjs ${{ matrix.from }} ${{ matrix.to }} 1 out/segc-${{ matrix.seg }}.mp4 2
      - name: Push segment to its own branch
        run: |
          cp out/segc-${{ matrix.seg }}.mp4 /tmp/segc-${{ matrix.seg }}.mp4
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git switch --orphan segc-${{ matrix.seg }}
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/segc-${{ matrix.seg }}.mp4 ./segc-${{ matrix.seg }}.mp4
          git add segc-${{ matrix.seg }}.mp4
          git commit -m "cicak segment ${{ matrix.seg }} frames ${{ matrix.from }}-${{ matrix.to }}"
          git push -f origin segc-${{ matrix.seg }}
